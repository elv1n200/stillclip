name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media:
    uses: ./.github/workflows/media.yml
  windows:
    needs: media
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: stillclip-media
          path: media-artifacts
      - name: Use the shipped media tools for synthetic tests
        shell: pwsh
        run: |
          Expand-Archive media-artifacts/stillclip-media-windows-x64.zip media-tools
          (Resolve-Path media-tools).Path | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Unit and regression tests
        run: cargo test --locked
      - name: Synthetic video tests (no screen or microphone capture)
        run: cargo test --locked synthetic_ -- --ignored --nocapture
      - name: Release build
        run: cargo build --locked --release
      - name: Build online and offline installers and portable package
        shell: pwsh
        run: ./packaging/build-installers.ps1
      - name: Verify installed application, upgrade and uninstall
        shell: pwsh
        run: ./packaging/test-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: stillclip-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.xz
            dist/*.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-checks
          path: installer-checks/
          if-no-files-found: ignore
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
