name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media:
    uses: ./.github/workflows/media.yml
  application:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit and regression tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Collect native executables and icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory native-artifacts | Out-Null
          Copy-Item target/release/stillclip.exe native-artifacts/
          $tests = Get-ChildItem target/debug -Filter 'stillclip-*.exe' -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$tests) { throw 'Native test executable is missing' }
          Copy-Item $tests.FullName native-artifacts/stillclip-tests.exe
          $icon = Get-ChildItem target/release/build -Filter stillclip.ico -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$icon) { throw 'Executable icon is missing' }
          Copy-Item $icon.FullName native-artifacts/stillclip.ico
      - uses: actions/upload-artifact@v4
        with:
          name: stillclip-native
          path: native-artifacts/
          if-no-files-found: error
  windows:
    needs: [media, application]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stillclip-native
          path: native-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: stillclip-media
          path: media-artifacts
      - name: Use the shipped media tools for synthetic tests
        shell: pwsh
        run: |
          Expand-Archive media-artifacts/stillclip-media-windows-x64.zip media-tools
          (Resolve-Path media-tools).Path | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Synthetic video tests (no screen or microphone capture)
        shell: pwsh
        run: |
          ./packaging/fetch-models.ps1 -OutputDir native-artifacts/models
          $env:STILLCLIP_MODELS_DIR = (Resolve-Path native-artifacts/models).Path
          & ./native-artifacts/stillclip-tests.exe synthetic_ --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed' }
      - name: Build online and offline installers and portable package
        shell: pwsh
        run: ./packaging/build-installers.ps1 -NativeDir native-artifacts
      - name: Verify installed application, upgrade and uninstall
        shell: pwsh
        run: ./packaging/test-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: stillclip-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.xz
            dist/*.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-checks
          path: installer-checks/
          if-no-files-found: ignore
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
